{% extends 'base.html' %}

{% block title %}Apollo - Doctor Application{% endblock %}

{% block content %}
<div class="auth-container">
        <div class="auth-card util-mw-600px" >
            <div class="page-header">
                <div class="header-text">
                    <h1>Apollo</h1>
                    <p>Doctor Application</p>
                </div>
            </div>

            {% if messages %}
                <div  class="util-mb-1rem">
                    {% include 'includes/messages.html' %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-grid util-gtc-repeat21fr" >
                    <div class="form-group util-gc-span2" >
                        <label class="form-label">Username</label>
                        <input class="form-input" type="text" name="username" placeholder="Choose a username" required>
                    </div>
                    
                    <div class="form-group util-gc-span2" >
                        <label class="form-label">Email</label>
                        <input class="form-input" type="email" name="email" placeholder="your.email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Specialization</label>
                        <input class="form-input" type="text" name="specialization" placeholder="e.g. Cardiology, Pediatrics" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input class="form-input" type="text" name="phone" placeholder="Contact number" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input class="form-input" type="password" name="password" placeholder="••••••••" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input class="form-input" type="password" name="password_confirm" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary util-mt-1rem" >Apply</button>
            </form>
            
            <div class="auth-footer">
                <p  class="util-mt-05rem">Already have an account? <a href="{% url 'login' %}">Login</a></p>
                <p  class="util-mt-05rem"><a href="{% url 'home' %}">← Back to Home</a></p>
            </div>
        </div>
    </div>
{% endblock %}

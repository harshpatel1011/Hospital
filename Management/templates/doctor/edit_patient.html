{% extends 'base.html' %}
{% block title %}Edit Patient - Apollo{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-text">
        <h1>Edit Patient</h1>
        <p>Update information for {{ patient.name }}</p>
    </div>
    <a href="{% url 'doctor_patients' %}" class="back-btn">← Back</a>
</div>

<div style="background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 2rem; max-width: 800px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input class="form-input" type="text" name="name" value="{{ patient.name }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input class="form-input" type="text" name="phone" value="{{ patient.phone }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Age</label>
                <input class="form-input" type="number" name="age" value="{{ patient.age }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Gender</label>
                <select class="form-input" name="gender" required style="appearance: auto; background-color: white;">
                    <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
                <label class="form-label">Address</label>
                <textarea class="form-input" name="address" rows="3" required>{{ patient.address }}</textarea>
            </div>
        </div>
        
        <button type="submit" class="btn-primary" style="margin-top: 1rem;">Update Patient</button>
    </form>
</div>
{% endblock %}

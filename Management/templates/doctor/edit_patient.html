{% extends 'base_dashboard.html' %}
{% block dashboard_title %}Edit Patient - Apollo{% endblock %}

{% block dashboard_content %}
<div class="page-header">
    <div class="header-text">
        <h1>Edit Patient</h1>
        <p>Update information for {{ patient.name }}</p>
    </div>
    <a href="{% url 'doctor_patients' %}" class="back-btn">← Back</a>
</div>

<div  class="util-bc-varbgcard-bor-1pxsolidvarbo786">
    <form method="POST">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input class="form-input" type="text" name="name" value="{{ patient.name }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input class="form-input" type="text" name="phone" value="{{ patient.phone }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Age</label>
                <input class="form-input" type="number" name="age" value="{{ patient.age }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Gender</label>
                <select class="form-input util-app-auto-bc-white" name="gender" required >
                    <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="form-group util-gc-11" >
                <label class="form-label">Address</label>
                <textarea class="form-input" name="address" rows="3" required>{{ patient.address }}</textarea>
            </div>
        </div>
        
        <button type="submit" class="btn-primary util-mt-1rem" >Update Patient</button>
    </form>
</div>
{% endblock %}

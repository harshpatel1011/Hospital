{% extends 'base.html' %}
{% block title %}Add Patient - Apollo{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-text">
        <h1>Add Patient</h1>
        <p>Register a new patient</p>
    </div>
    <a href="{% url 'doctor_patients' %}" class="back-btn">← Back</a>
</div>

<div style="background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 2rem; max-width: 800px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input class="form-input" type="text" name="name" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input class="form-input" type="text" name="phone" placeholder="+1 (555) 000-0000" required>
            </div>

            <div class="form-group">
                <label class="form-label">Age</label>
                <input class="form-input" type="number" name="age" placeholder="e.g. 35" required>
            </div>

            <div class="form-group">
                <label class="form-label">Gender</label>
                <select class="form-input" name="gender" required style="appearance: auto; background-color: white;">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
                <label class="form-label">Address</label>
                <textarea class="form-input" name="address" rows="3" placeholder="123 Main St, City, Country" required></textarea>
            </div>
        </div>
        
        <button type="submit" class="btn-primary" style="margin-top: 1rem;">Save Patient</button>
    </form>
</div>
{% endblock %}

{% extends 'base_dashboard.html' %}
{% block dashboard_title %}Add Patient - Apollo{% endblock %}

{% block dashboard_content %}
<div class="page-header">
    <div class="header-text">
        <h1>Add Patient</h1>
        <p>Register a new patient</p>
    </div>
    <a href="{% url 'doctor_patients' %}" class="back-btn">← Back</a>
</div>

<div  class="util-bc-varbgcard-bor-1pxsolidvarbo786">
    <form method="POST">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input class="form-input" type="text" name="name" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input class="form-input" type="text" name="phone" placeholder="+1 (555) 000-0000" required>
            </div>

            <div class="form-group">
                <label class="form-label">Age</label>
                <input class="form-input" type="number" name="age" placeholder="e.g. 35" required>
            </div>

            <div class="form-group">
                <label class="form-label">Gender</label>
                <select class="form-input util-app-auto-bc-white" name="gender" required >
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group util-gc-11" >
                <label class="form-label">Address</label>
                <textarea class="form-input" name="address" rows="3" placeholder="123 Main St, City, Country" required></textarea>
            </div>
        </div>
        
        <button type="submit" class="btn-primary util-mt-1rem" >Save Patient</button>
    </form>
</div>
{% endblock %}

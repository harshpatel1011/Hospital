{% extends 'base_dashboard.html' %}
{% block dashboard_title %}Add Doctor - Apollo{% endblock %}

{% block dashboard_content %}
<div class="page-header">
    <div class="header-text">
        <h1>Add New Doctor</h1>
        <p>Register a new doctor in the system</p>
    </div>
</div>

<div class="auth-card" style="margin: 0; max-width: 800px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input class="form-input" type="text" name="username" placeholder="johndoe" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input class="form-input" type="email" name="email" placeholder="johndoe@hospital.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" type="password" name="password" placeholder="Secure password" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input class="form-input" type="text" name="phone" placeholder="+1 (555) 000-0000" required>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
                <label class="form-label">Specialization</label>
                <input class="form-input" type="text" name="specialization" placeholder="e.g. Cardiologist" required>
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn-primary">Add Doctor</button>
            <a href="{% url 'admin_doctors' %}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% extends 'base_dashboard.html' %}
{% block dashboard_title %}Add Staff - Apollo{% endblock %}

{% block dashboard_content %}
<div class="page-header">
    <div class="header-text">
        <h1>Add New Staff</h1>
        <p>Register a new staff member in the system</p>
    </div>
</div>

<div class="auth-card util-mar-0-mw-800px" >
    <form method="POST">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group util-gc-11" >
                <label class="form-label">Full Name</label>
                <input class="form-input" type="text" name="name" placeholder="Staff Name" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Role Title</label>
                <input class="form-input" type="text" name="role_title" placeholder="e.g. Nurse, Receptionist" required>
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input class="form-input" type="text" name="phone" placeholder="+1 (555) 000-0000" required>
            </div>

            <div class="form-group util-gc-11" >
                <label class="form-label">Email</label>
                <input class="form-input" type="email" name="email" placeholder="staff@hospital.com" required>
            </div>
        </div>
        
        <div  class="util-dis-flex-gap-1rem-mt-2rem">
            <button type="submit" class="btn-primary">Add Staff</button>
            <a href="{% url 'admin_staff' %}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

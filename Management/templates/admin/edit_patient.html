{% extends 'base.html' %}
{% block title %}Edit Patient - Apollo{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-text">
        <h1>Edit Patient: {{ patient.name }}</h1>
        <p>Update patient details</p>
    </div>
</div>

<div class="auth-card" style="margin: 0; max-width: 800px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group" style="grid-column: 1 / -1;">
                <label class="form-label">Full Name</label>
                <input class="form-input" type="text" name="name" value="{{ patient.name }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Age</label>
                <input class="form-input" type="number" name="age" min="0" max="150" value="{{ patient.age }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-input" required>
                    <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input class="form-input" type="text" name="phone" value="{{ patient.phone }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Assigned Doctor</label>
                <select name="doctor_id" class="form-input" required>
                    <option value="" disabled {% if not patient.added_by %}selected{% endif %}>Select a Doctor</option>
                    {% for doc in doctors %}
                    <option value="{{ doc.id }}" {% if patient.added_by.id == doc.id %}selected{% endif %}>Dr. {{ doc.username }} - {{ doc.specialization }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
                <label class="form-label">Address</label>
                <textarea class="form-input" name="address" rows="3" required>{{ patient.address }}</textarea>
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="{% url 'admin_patients' %}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

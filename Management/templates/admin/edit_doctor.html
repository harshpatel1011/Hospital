{% extends 'base_dashboard.html' %}
{% block dashboard_title %}Edit Doctor - Apollo{% endblock %}

{% block dashboard_content %}
<div class="page-header">
    <div class="header-text">
        <h1>Edit Doctor: {{ doctor.username }}</h1>
        <p>Update doctor details</p>
    </div>
</div>

<div class="auth-card util-mar-0-mw-800px" >
    <form method="POST">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input class="form-input" type="text" name="username" value="{{ doctor.username }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input class="form-input" type="email" name="email" value="{{ doctor.email }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" type="password" name="password" placeholder="Leave blank to keep unchanged">
            </div>
            
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input class="form-input" type="text" name="phone" value="{{ doctor.phone }}" required>
            </div>

            <div class="form-group util-gc-11" >
                <label class="form-label">Specialization</label>
                <input class="form-input" type="text" name="specialization" value="{{ doctor.specialization }}" required>
            </div>
        </div>
        
        <div  class="util-dis-flex-gap-1rem-mt-2rem">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="{% url 'admin_doctors' %}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

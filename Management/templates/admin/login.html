{% extends 'base.html' %}

{% block title %}Apollo - Admin Login{% endblock %}

{% block content %}
<div class="auth-container">
        <div class="auth-card">
            <div class="page-header">
                <div class="header-text">
                    <h1>Apollo</h1>
                    <p>Admin Login</p>
                </div>
            </div>

            {% if messages %}
                <div  class="util-mb-1rem">
                    {% include 'includes/messages.html' %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-grid util-gtc-1fr" >
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-input" type="text" id="username" name="username" placeholder="Admin username" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Log In</button>
            </form>
            
            <div class="auth-footer">
                <p  class="util-mt-05rem"><a href="{% url 'home' %}">← Back to Home</a></p>
            </div>
        </div>
    </div>
{% endblock %}

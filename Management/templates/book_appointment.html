{% extends 'base.html' %}

{% block title %}Book Appointment - Apollo{% endblock %}

{% block content %}
<div class="auth-container util-pad-4rem2rem" >
        <div class="auth-card util-bac-transparent-bor-none-bs-no604" >
            <div class="page-header">
                <div class="header-text">
                    <h1>Book Appointment</h1>
                    <p>Schedule a visit with our specialists</p>
                </div>
            </div>

            {% if messages %}
                <div  class="util-mb-1rem">
                    {% include 'includes/messages.html' %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-grid grid-4">
                    <div class="form-group util-gc-span2" >
                        <label class="form-label">Full Name</label>
                        <input class="form-input" type="text" name="patient_name" placeholder="John Doe" required>
                    </div>
                    
                    <div class="form-group util-gc-span2" >
                        <label class="form-label">Phone Number</label>
                        <input class="form-input" type="text" name="phone" placeholder="+1 (555) 000-0000" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Gender</label>
                        <select class="form-input util-app-auto-bc-white" name="gender" required >
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Age</label>
                        <input class="form-input" type="number" name="age" placeholder="e.g. 35" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input class="form-input" type="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Time</label>
                        <input class="form-input" type="time" name="time" required>
                    </div>

                    <div class="form-group util-gc-span2" >
                        <label class="form-label">Address</label>
                        <textarea class="form-input" name="address" rows="4" placeholder="123 Main St, City, Country" required></textarea>
                    </div>

                    <div class="form-group util-gc-span2" >
                        <label class="form-label">Reason for Visit</label>
                        <textarea class="form-input" name="reason" rows="4" placeholder="Briefly describe the reason for your visit..." required></textarea>
                    </div>

                    <div class="form-group"">
                        <label class="form-label">Preferred Doctor</label>
                        <select class="form-input util-app-auto-bc-white" name="doctor" >
                            <option value="">Select a Doctor</option>
                            {% for doc in doctors %}
                                <option value="{{ doc.id }}">Dr. {{ doc.username }} ({{ doc.specialization }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary util-mt-1rem-wid-100-jc-center" >Confirm Appointment</button>
            </form>
            
            <div class="auth-footer">
                <p  class="util-mt-05rem"><a href="{% url 'home' %}">← Back to Home</a></p>
            </div>
        </div>
    </div>
{% endblock %}
